<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="eyeGradA" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7C6AFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5F52E0"/>
    </radialGradient>
    <linearGradient id="eyeOutlineA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B8AFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="bgGlowA" cx="0.5" cy="0.48" r="0.5">
      <stop offset="0%" stop-color="#7C6AFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0C1222" stop-opacity="0"/>
    </radialGradient>
    <filter id="eyeGlowA" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#22D3EE" flood-opacity="0.35"/>
    </filter>
    <filter id="arcGlowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#0C1222"/>
  <rect width="1024" height="1024" fill="url(#bgGlowA)"/>

  <!-- Eye shape (almond vignette) -->
  <path d="M 162 512
           C 310 280 420 200 512 200
           C 604 200 714 280 862 512
           C 714 744 604 824 512 824
           C 420 824 310 744 162 512
           Z"
        fill="url(#eyeGradA)" filter="url(#eyeGlowA)"/>

  <!-- Eye outline glow -->
  <path d="M 162 512
           C 310 280 420 200 512 200
           C 604 200 714 280 862 512
           C 714 744 604 824 512 824
           C 420 824 310 744 162 512
           Z"
        fill="none" stroke="url(#eyeOutlineA)" stroke-width="4" opacity="0.6"/>

  <!-- Pupil area: dark center -->
  <ellipse cx="512" cy="512" rx="140" ry="140" fill="#0C1222"/>

  <!-- Satellite arcs inside pupil -->
  <g filter="url(#arcGlowA)">
    <!-- Arc 1 (-inner) -->
    <path d="M 430 512 A 82 82 0 0 1 594 512" fill="none" stroke="#22D3EE" stroke-width="3" opacity="0.95"/>
    <!-- Arc 2 (middle) -->
    <path d="M 400 512 A 112 112 0 0 1 624 512" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.75"/>
    <!-- Arc 3 (outer) -->
    <path d="M 370 512 A 142 142 0 0 1 654 512" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- Catchlight (reflection) -->
  <path d="M 470 470 L 485 455 L 450 490 Z" fill="white" opacity="0.5" transform="rotate(-30, 475, 475)"/>

  <!-- Outer glow ring -->
  <path d="M 162 512
           C 310 280 420 200 512 200
           C 604 200 714 280 862 512
           C 714 744 604 824 512 824
           C 420 824 310 744 162 512
           Z"
        fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.2"/>
</svg>