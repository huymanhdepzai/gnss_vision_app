<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="pinGradFg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#7C6AFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="pinRadialFg" cx="0.45" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#9B8AFF"/>
      <stop offset="50%" stop-color="#7C6AFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </radialGradient>
    <linearGradient id="ring1GradFg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="70%" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ring2GradFg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B8AFF" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#9B8AFF" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#9B8AFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9B8AFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="ring3GradFg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.15"/>
      <stop offset="30%" stop-color="#67E8F9" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#67E8F9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="pinGlowFg" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#7C6AFF" flood-opacity="0.4"/>
    </filter>
    <filter id="ringGlowFg" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="starGlowFg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ring 3: IMU (tilted -60°) - back layer -->
  <g transform="rotate(-60, 512, 370)" filter="url(#ringGlowFg)">
    <ellipse cx="512" cy="370" rx="215" ry="68" fill="none" stroke="url(#ring3GradFg)" stroke-width="2.5"/>
  </g>

  <!-- Ring 2: Vision (tilted 60°) - middle layer -->
  <g transform="rotate(60, 512, 370)" filter="url(#ringGlowFg)">
    <ellipse cx="512" cy="370" rx="215" ry="68" fill="none" stroke="url(#ring2GradFg)" stroke-width="2.8"/>
  </g>

  <!-- Location Pin -->
  <path d="M 512 710
           C 478 650 336 500 336 365
           A 176 176 0 0 1 688 365
           C 688 500 546 650 512 710
           Z"
        fill="url(#pinRadialFg)" filter="url(#pinGlowFg)"/>

  <!-- Pin inner highlight ring -->
  <circle cx="512" cy="368" r="105" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>

  <!-- Pin inner gradient overlay -->
  <circle cx="512" cy="348" r="60" fill="white" opacity="0.06"/>

  <!-- Compass icon (diamond with cyan north) -->
  <g filter="url(#starGlowFg)">
    <path d="M 512 328 L 536 368 L 512 408 L 488 368 Z" fill="white" opacity="0.85"/>
    <path d="M 512 328 L 536 368 L 512 368 Z" fill="#22D3EE" opacity="0.95"/>
  </g>

  <!-- Center dot -->
  <circle cx="512" cy="368" r="5" fill="white" opacity="0.9"/>

  <!-- Ring 1: GNSS (horizontal) - front layer -->
  <g filter="url(#ringGlowFg)">
    <ellipse cx="512" cy="370" rx="215" ry="68" fill="none" stroke="url(#ring1GradFg)" stroke-width="3"/>
  </g>

  <!-- Satellite dots on Ring 1 -->
  <circle cx="727" cy="370" r="7" fill="#22D3EE" opacity="0.95"/>
  <circle cx="727" cy="370" r="12" fill="#22D3EE" opacity="0.2"/>
  <circle cx="297" cy="370" r="7" fill="#22D3EE" opacity="0.95"/>
  <circle cx="297" cy="370" r="12" fill="#22D3EE" opacity="0.2"/>

  <!-- Satellite dots on Ring 2 -->
  <circle cx="619" cy="253" r="5.5" fill="#9B8AFF" opacity="0.9"/>
  <circle cx="619" cy="253" r="10" fill="#9B8AFF" opacity="0.15"/>
  <circle cx="405" cy="487" r="5.5" fill="#9B8AFF" opacity="0.9"/>
  <circle cx="405" cy="487" r="10" fill="#9B8AFF" opacity="0.15"/>

  <!-- Satellite dots on Ring 3 -->
  <circle cx="405" cy="253" r="5" fill="#67E8F9" opacity="0.75"/>
  <circle cx="405" cy="253" r="9" fill="#67E8F9" opacity="0.12"/>
  <circle cx="619" cy="487" r="5" fill="#67E8F9" opacity="0.75"/>
  <circle cx="619" cy="487" r="9" fill="#67E8F9" opacity="0.12"/>

</svg>